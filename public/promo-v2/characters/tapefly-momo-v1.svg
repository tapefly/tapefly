<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#174a4d"/>
      <stop offset=".52" stop-color="#09262b"/>
      <stop offset="1" stop-color="#041013"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f1b64b" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#79efbd" stop-opacity=".07"/>
      <stop offset="1" stop-color="#061519" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd596"/>
      <stop offset=".45" stop-color="#e6a657"/>
      <stop offset="1" stop-color="#ad642e"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a5"/>
      <stop offset="1" stop-color="#c47a36"/>
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ff9092"/>
      <stop offset=".25" stop-color="#ed4d5a"/>
      <stop offset=".72" stop-color="#9f1e31"/>
      <stop offset="1" stop-color="#5b0d1d"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7fffa" stop-opacity=".68"/>
      <stop offset=".48" stop-color="#89f5d1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4ccbaa" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6e70"/>
      <stop offset="1" stop-color="#173439"/>
    </linearGradient>
    <linearGradient id="sugar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".65" stop-color="#e9e1c8"/>
      <stop offset="1" stop-color="#b8ab89"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#b9efdf" stroke-opacity=".055" stroke-width="1.5"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#000b0d" flood-opacity=".65"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M800 716c-154 0-270 137-270 327 0 194 109 333 270 333s270-139 270-333c0-190-116-327-270-327Z"/>
    </clipPath>
    <clipPath id="eyeLeft">
      <ellipse cx="622" cy="558" rx="151" ry="187"/>
    </clipPath>
    <clipPath id="eyeRight">
      <ellipse cx="978" cy="558" rx="151" ry="187"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <rect width="1600" height="1600" fill="url(#grid)"/>
  <circle cx="800" cy="760" r="670" fill="url(#halo)"/>

  <g opacity=".55" fill="#f1b64b">
    <circle cx="214" cy="383" r="5"/>
    <circle cx="1352" cy="742" r="4"/>
    <circle cx="310" cy="1110" r="3"/>
    <circle cx="1252" cy="1220" r="4"/>
    <path d="M1322 280h12v12h-12zM260 756h9v9h-9zM1158 320h7v7h-7z"/>
