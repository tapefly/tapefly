name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: the lineage ledger recomputes from the founder
        run: npm run lineage -- --check

      # every submitted agent record is replayed and re-hashed here;
      # a single bad record fails the build and blocks the merge.
      - name: verify agent records
        run: |
          files=$(find agents -name '*.json' -not -path 'agents/example/*' | sort)
          if [ -n "$files" ]; then npm run verify-record -- $files; else echo "no agent records yet"; fi

      - name: the example record still verifies
        run: npm run verify-record -- agents/example/2026-10-15.json

      # every brain under challengers/ is validated and the index must match the files;
      # scores are recomputed from the circuits, never taken from the entry.
      - name: the board's entries are valid and indexed
        run: npm run board -- --check --show

      # an entry that claims a tape-out is asked all 4,096 questions on chain (free, read-only)
      - name: official flies answer on chain exactly like their entries
        run: npm run board -- --chain

      - name: the TapeOut bytes still hash to the committed value
        run: npm run tapeout -- bytes > /dev/null

      - name: build
        run: npm run build
