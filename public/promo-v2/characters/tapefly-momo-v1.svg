      <path d="M620 910 489 928 414 866" fill="none" stroke="#10292e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M980 910 1111 928 1186 866" fill="none" stroke="#10292e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="405" cy="858" r="34" fill="#f1b64b" stroke="#10292e" stroke-width="10"/>
      <circle cx="1195" cy="858" r="34" fill="#f1b64b" stroke="#10292e" stroke-width="10"/>

