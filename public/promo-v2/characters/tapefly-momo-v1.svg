      <circle cx="800" cy="990" r="86" fill="none" stroke="#f1b64b" stroke-opacity=".24" stroke-width="24" filter="url(#glow)"/>
      <circle cx="800" cy="990" r="72" fill="#0c2b31" stroke="#f1b64b" stroke-width="8"/>
