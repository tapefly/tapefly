  <g opacity=".18" fill="none" stroke="#79efbd" stroke-width="3">
    <path d="M96 620h142v108h92M1362 560h-124v162h-90M170 1266h168v-94h86M1438 1100h-180v78h-74"/>
    <circle cx="330" cy="728" r="10"/><circle cx="1148" cy="722" r="10"/><circle cx="424" cy="1172" r="10"/><circle cx="1184" cy="1178" r="10"/>
  </g>

  <ellipse cx="800" cy="1328" rx="385" ry="78" fill="#00080a" opacity=".55" filter="url(#soft)"/>

