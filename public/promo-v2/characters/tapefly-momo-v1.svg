          <path d="M907 852c125-111 286-152 392-98M922 897c105-53 229-67 332-21M887 937c67-5 138 18 205 60"/>
        </g>
      </g>

      <!-- rear legs -->
      <g fill="none" stroke="#10292e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M625 1074 546 1186 495 1308"/>
        <path d="M659 1160 604 1287 628 1392"/>
        <path d="M975 1074 1054 1186 1105 1308"/>
        <path d="M941 1160 996 1287 972 1392"/>
      </g>
      <g fill="#f1b64b" stroke="#10292e" stroke-width="10">
        <ellipse cx="486" cy="1319" rx="38" ry="23" transform="rotate(21 486 1319)"/>
        <ellipse cx="627" cy="1402" rx="35" ry="22" transform="rotate(8 627 1402)"/>
        <ellipse cx="1114" cy="1319" rx="38" ry="23" transform="rotate(-21 1114 1319)"/>
        <ellipse cx="973" cy="1402" rx="35" ry="22" transform="rotate(-8 973 1402)"/>
