        <g clip-path="url(#eyeLeft)" fill="#ffd7d8" opacity=".23">
          <circle cx="558" cy="491" r="18"/><circle cx="618" cy="474" r="15"/><circle cx="679" cy="498" r="13"/>
          <circle cx="538" cy="557" r="14"/><circle cx="599" cy="542" r="17"/><circle cx="663" cy="565" r="12"/>
          <circle cx="561" cy="622" r="15"/><circle cx="627" cy="616" r="13"/><circle cx="685" cy="640" r="11"/>
        </g>
        <g clip-path="url(#eyeRight)" fill="#ffd7d8" opacity=".23">
          <circle cx="914" cy="491" r="18"/><circle cx="974" cy="474" r="15"/><circle cx="1035" cy="498" r="13"/>
          <circle cx="894" cy="557" r="14"/><circle cx="955" cy="542" r="17"/><circle cx="1019" cy="565" r="12"/>
          <circle cx="917" cy="622" r="15"/><circle cx="983" cy="616" r="13"/><circle cx="1041" cy="640" r="11"/>
        </g>
        <ellipse cx="570" cy="512" rx="39" ry="62" fill="#fff" opacity=".72" transform="rotate(24 570 512)"/>
        <ellipse cx="926" cy="512" rx="39" ry="62" fill="#fff" opacity=".72" transform="rotate(24 926 512)"/>
        <circle cx="556" cy="489" r="12" fill="#fff"/>
        <circle cx="912" cy="489" r="12" fill="#fff"/>

        <!-- face -->
        <ellipse cx="743" cy="720" rx="34" ry="18" fill="#e65758" opacity=".22"/>
        <ellipse cx="857" cy="720" rx="34" ry="18" fill="#e65758" opacity=".22"/>
        <path d="M774 690c13 19 39 19 52 0" fill="none" stroke="#10282d" stroke-width="13" stroke-linecap="round"/>
        <path d="M798 700c-3 25 5 42 25 51" fill="none" stroke="#10282d" stroke-width="8" stroke-linecap="round" opacity=".7"/>
        <circle cx="800" cy="646" r="10" fill="#fff1c5" opacity=".8"/>

        <!-- head seam -->
        <path d="M800 270v126" stroke="#9b5928" stroke-width="8" stroke-linecap="round" opacity=".35"/>
        <path d="M748 275c7 55 7 91 0 128M852 275c-7 55-7 91 0 128" fill="none" stroke="#ffdf9e" stroke-width="5" opacity=".28"/>
      </g>
    </g>
  </g>

  <!-- sugar cube -->
  <g transform="translate(1268 548) rotate(8)" filter="url(#shadow)">
    <path d="M0 38 121 0l121 38-121 45z" fill="#fffdf3" stroke="#10282d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M0 38v124l121 54 121-54V38L121 83Z" fill="url(#sugar)" stroke="#10282d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M121 83v133" stroke="#10282d" stroke-width="9" opacity=".6"/>
    <path d="M24 62v91l97 43V83Z" fill="#fff" opacity=".35"/>
    <g fill="#f1b64b" opacity=".7">
      <circle cx="68" cy="47" r="5"/><circle cx="169" cy="57" r="4"/><circle cx="85" cy="120" r="4"/>
    </g>
  </g>

  <!-- identity plate -->
  <g transform="translate(800 1489)">
    <rect x="-392" y="-74" width="784" height="148" rx="10" fill="#061519" stroke="#f1b64b" stroke-opacity=".54" stroke-width="3"/>
    <text x="0" y="-16" fill="#f1b64b" font-family="SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="5" text-anchor="middle">TAPEFLY / UNIT 01</text>
    <text x="0" y="38" fill="#eff4ec" font-family="Songti SC, STSong, serif" font-size="58" font-weight="600" letter-spacing="2" text-anchor="middle">倔强一号</text>
    <text x="0" y="63" fill="#8da29d" font-family="SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" text-anchor="middle">CLUMSY · CURIOUS · SOMETIMES MAKES IT HOME</text>
  </g>
