name: extend the lineage

# The ledger grows one day per day. This runs shortly after 00:00 UTC, advances
# sim/lineage.json to yesterday, and opens a pull request if anything changed.
# Merging it is what makes the new day's clutch descend from the last champion.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  extend:
    runs-on: ubuntu-latest
    env:
      # optional: set this repository secret to anchor each day's lineage head on BNB Chain.
      # It is the key of a wallet holding a little BNB for gas, used only for zero-value
      # self-sends. Without it, this job still extends the ledger and skips anchoring.
      ANCHOR_PRIVATE_KEY: ${{ secrets.ANCHOR_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: advance the ledger to today
        run: npm run lineage

      - name: prove the ledger still recomputes
        run: npm run lineage -- --check

      # a finished week becomes a season record (its bodies come from the ledger above)
      - name: record finished seasons
        run: npm run board && npm run board -- --check

      # yesterday's lineage head, written onto BNB Chain (skipped without the secret)
      - name: anchor yesterday on BNB Chain
        if: ${{ env.ANCHOR_PRIVATE_KEY != '' }}
        run: npm run anchor && npm run anchor -- --check

      - name: open a pull request if the ledger grew
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- sim/lineage.json challengers/seasons.json anchors/anchors.json; then
            echo "the ledger is already current"
            exit 0
          fi
          git config user.name "richard7463"
          git config user.email "richard7463@users.noreply.github.com"
          branch="lineage/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add sim/lineage.json challengers/seasons.json anchors/anchors.json
          git commit -m "Extend the lineage ledger (and seasons) to $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh pr create \
            --title "Extend the lineage ledger" \
            --body "The daily cron advanced \`sim/lineage.json\` and recorded any finished season in \`challengers/seasons.json\`. Both recompute and agree." \
            --base main --head "$branch"
