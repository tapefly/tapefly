        <circle cx="0" cy="-42" r="12" fill="#79efbd" filter="url(#glow)"/>
        <path d="M-28 52h56" stroke="#f1b64b" stroke-width="11" stroke-linecap="round"/>
        <path d="M-28 78h32" stroke="#79efbd" stroke-width="8" stroke-linecap="round"/>
